function transportName(v){const m=String(v||'').match(/^Bus\s+(\d+)$/i);return m?'Bus stop code '+m[1]:v}
function render(){
 $('types').innerHTML=Object.keys(labels).map(k=>`<button data-type="${k}" class="${home===k?'active':''}">${labels[k]}</button>`).join('');
 $('types').querySelectorAll('button').forEach(b=>b.onclick=()=>{home=b.dataset.type;$('budget').value=home==='hdb'?3200:home==='condo'?4500:7500;render();$('results').hidden=true});
 $('coverage').textContent=`${housingRows().length} areas have ${labels[home]} rent data`;$('budgetValue').textContent=money(+$('budget').value);
 $('criteria').innerHTML=criteria.map(c=>`<button class="criterion ${selected.has(c.id)?'active':''}" data-id="${c.id}"><span>${c.label}</span><span class="tick">✓</span></button>`).join('');
 $('criteria').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected.has(b.dataset.id)?selected.delete(b.dataset.id):selected.add(b.dataset.id);render();$('results').hidden=true});
 $('count').textContent=`${selected.size} selected`;$('find').disabled=!selected.size;
}
$('budget').oninput=()=>{$('budgetValue').textContent=money(+$('budget').value);$('results').hidden=true};
$('find').onclick=()=>{
 const budget=+$('budget').value,active=criteria.filter(c=>selected.has(c.id)),pool=housingRows(),minimum=Math.min(...pool.map(r=>num(r[priceColumn()]))),out=$('results');out.hidden=false;
 if(budget<minimum){out.innerHTML=`<h2>Price constraints invalid</h2><p class="intro">The lowest available ${labels[home]} rent in this dataset is ${money(minimum)}. Increase your budget to receive results.</p>`;return}
 const ranges=Object.fromEntries(active.map(c=>{const v=rows.map(r=>num(r[c.column])).filter(v=>v!==null);return[c.id,{min:Math.min(...v),max:Math.max(...v)}]}));
 const eligible=pool.filter(r=>num(r[priceColumn()])<=budget&&active.every(c=>num(r[c.column])!==null));
 const ranked=eligible.map(r=>{const scores=active.map(c=>{const v=num(r[c.column]),q=ranges[c.id],span=q.max-q.min||1,n=(v-q.min)/span;return Math.max(0,Math.min(1,c.high?n:1-n))});return{r,scores,match:scores.reduce((a,b)=>a+b,0)/scores.length*100}}).sort((a,b)=>b.match-a.match).slice(0,3);
 if(!ranked.length){out.innerHTML=`<h2>No results</h2><p class="intro">No area has a ${labels[home]} rent at or below ${money(budget)} with data for every selected category.</p>`;return}
 out.innerHTML=`<h2>Your three closest matches</h2><div class="cards">${ranked.map((x,i)=>`<article class="card"><div class="rank">0${i+1}</div><div class="match">${Math.round(x.match)}%</div><h3>${x.r.planning_area}</h3><p class="price">${money(num(x.r[priceColumn()]))}</p><div class="scores">${active.map((c,j)=>{let n=c.name?x.r[c.name]:c.id==='wheelchair'?'Tier '+x.r.wheelchair_accessibility_tier:'';if(c.id==='transport')n=transportName(n);return`<div class="score"><span><b>${c.label}</b>${n?`<small>${n}</small>`:''}</span><span class="value">${c.high?Math.round(x.scores[j]*100)+'/100':num(x.r[c.column]).toFixed(2)+' km from centre'}</span></div>`}).join('')}</div></article>`).join('')}</div>`;
};render();
</script>
</body></html>
